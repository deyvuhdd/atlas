<h1>Atlas</h1>
<p>Atlas is a private, personal life-admin app used only by its owner. It is not offered to the public.</p>
<p>With the owner's permission, Atlas can read the owner's own email so it can show it in one inbox, help sort it, and draft replies that the owner reviews and sends himself.</p>
